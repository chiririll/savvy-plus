# Docker image CI is paused with the image publish path.
name: CI (Docker)

on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  image:
    name: Docker build + goss smoke
    runs-on: ubuntu-latest
    env:
      GOSS_VERSION: v0.4.9
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: savvy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name savvy-ci -p 8081:80 savvy:ci

      - name: Install goss
        run: |
          sudo curl -fsSL "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/goss-linux-amd64" -o /usr/local/bin/goss
          sudo chmod +x /usr/local/bin/goss

      - name: Run goss contract
        env:
          GOSS_USE_ALPHA: '1'
        run: |
          goss -g deploy/docker/goss.yaml \
            --vars-inline '{"base": "http://localhost:8081"}' \
            validate --format documentation --retry-timeout 90s --sleep 2s

      - name: Container logs on failure
        if: failure()
        run: docker logs savvy-ci

      - name: Teardown
        if: always()
        run: docker rm -f savvy-ci

  trivy:
    name: Image vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: savvy:ci
          cache-from: type=gha

      - name: Trivy vulnerability + secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: savvy:ci
          format: table
          vuln-type: os,library
          scanners: vuln,secret
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  dockerfile:
    name: Dockerfile lint + misconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Trivy config (misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: '1'
