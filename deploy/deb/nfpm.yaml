name: savvy
arch: all
platform: linux
version: ${APP_VERSION}
version_schema: semver
release: "1"
section: web
priority: optional
maintainer: Kirill Chizhov <sstive39@gmail.com>
homepage: https://github.com/chiririll/savvy-plus
license: MIT
description: |-
  Selfhosted expense tracker with multi-currency support.
  .
  Installs the Savvy app under /opt/savvy, SQLite data in /var/lib/savvy,
  an nginx site, and systemd units for the queue worker and scheduler.
  Requires PHP 8.4 (Debian 13 or a PHP 8.4 repository).

depends:
  - nginx
  - openssl
  - php8.4-bcmath
  - php8.4-cli
  - php8.4-curl
  - php8.4-fpm
  - php8.4-intl
  - php8.4-mbstring
  - php8.4-sqlite3
  - php8.4-xml
  - php8.4-zip
  - sqlite3

recommends:
  - php8.4-opcache

contents:
  - src: ../../dist/deb-root
    dst: /opt/savvy
    type: tree
  - src: nginx.conf
    dst: /etc/nginx/sites-available/savvy
    type: config
  - src: savvy-queue.service
    dst: /usr/lib/systemd/system/savvy-queue.service
  - src: savvy-scheduler.service
    dst: /usr/lib/systemd/system/savvy-scheduler.service
  - src: install.env
    dst: /etc/savvy/install.env
    type: config
  - dst: /var/lib/savvy
    type: dir
    file_info:
      mode: 0775
      owner: www-data
      group: www-data

scripts:
  postinstall: postinst
  preremove: prerm
  postremove: postrm
